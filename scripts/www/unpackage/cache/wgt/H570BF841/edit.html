<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport"
			content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no" />
		<title></title>
		<script src="js/mui.min.js"></script>
		<link href="css/mui.min.css" rel="stylesheet" />
		<style>
			#page {
				display: none;
			}

			/* Vue加载完成后显示 */
			#page.vue-loaded {
				display: block;
			}

			.mui-table-view.mui-grid-view .mui-table-view-cell .mui-media-body {
				font-size: 13px;
			}
		</style>
	</head>
	<body>
		<header class="mui-bar mui-bar-nav">
			<a class="mui-action-back mui-icon mui-icon-left-nav mui-pull-left"></a>
			<h1 class="mui-title">修改服务器信息</h1>
		</header>
		<div class="mui-content" id="page">
			<div class="mui-card">
				<form class="mui-input-group">
					<div class="mui-input-row">
						<label>服务器备注</label>
						<input type="text" v-model="serverName" class="mui-input-clear" placeholder="输入备注名">
					</div>
					<div class="mui-input-row">
						<label>服务器地址</label>
						<input type="text" v-model="serverAddr" class="mui-input-clear" placeholder="https://ip:端口">
					</div>
					<div class="mui-input-row">
						<label>接口密钥</label>
						<input type="text" v-model="apiKey" class="mui-input-clear" placeholder="面板设置中复制粘贴">
					</div>
				</form>
			</div>
			<div class="mui-button-row">
				<button type="button" class="mui-btn mui-btn-blue" @click="editServer">保存</button>
			</div>
		</div>
		<script src="js/vue.global.prod.min.js"></script>
		<script>
			mui.init();

			const { createApp, ref, onMounted, reactive } = Vue

			createApp({
				setup() {
					const serverName = ref('')
					const serverAddr = ref('')
					const apiKey = ref('')
					let apiKey4Global = reactive('')

					const result = ref([])

					const editServer = () => {
						if (serverName.value.trim() === '') {
							mui.toast('请输入服务器备注',{type:'div'})
							return
						}
						if (serverAddr.value.trim() === '') {
							mui.toast('请输入服务器地址',{type:'div'})
							return
						}
						if (apiKey.value.trim() === '') {
							mui.toast('请输入接口密钥',{type:'div'})
							return
						}

						let key = apiKey.value
						let serverInfo = {}
						serverInfo[key] = {
							serverName: serverName.value,
							serverAddr: serverAddr.value,
							apiKey: apiKey.value
						}
						
						let savedServerList = localStorage.getItem('serverList') || '{}'
						let serverList = JSON.parse(savedServerList)

						mui.extend(serverList, serverInfo)
						localStorage.setItem('serverList', JSON.stringify(serverList))
						
						if( mui.os.plus ){
							let listPage = plus.webview.getLaunchWebview()
							mui.fire(listPage,'refreshList')
							
							let detailPage = plus.webview.getWebviewById('detail.html')
							mui.fire(detailPage,'refreshDetail')
						}

						mui.alert('服务器信息修改成功', '系统提示', '确定', function(e) {}, 'div')
					}

					const getServerInfo = () => {
						const searchParams = new URLSearchParams(location.search);

						const _apiKey = searchParams.get("apiKey")

						const savedServerList = localStorage.getItem('serverList') || '{}'
						const serverList = JSON.parse(savedServerList)

						const serverInfo = serverList[_apiKey]

						serverName.value = serverInfo.serverName ?? ''
						serverAddr.value = serverInfo.serverAddr ?? ''
						apiKey.value = serverInfo.apiKey ?? ''

						apiKey4Global = serverInfo.apiKey ?? ''
					}

					

					onMounted(() => {
						getServerInfo()

						mui('#page')[0].classList.add('vue-loaded')
					})

					return {
						serverName,
						serverAddr,
						apiKey,
						editServer,
					}
				}
			}).mount('#page')
		</script>
	</body>
</html>

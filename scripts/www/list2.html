<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport"
			content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
		<title></title>
		<script src="html5plus://ready"></script><!-- 如果使用这个协议，那么必须放在所有script之前 -->
		<script src="js/mui.min.js"></script>
		<link href="css/mui.min.css" rel="stylesheet" />
		<link href="css/common.css" rel="stylesheet" />
		<style>
			.mui-scroll-wrapper {
				/* top: 98px; */
				padding-bottom: 50px;
			}

			.mui-scroll-wrapper .mui-card {
				margin-top: 0;
			}

			.btn-group {
				display: flex;
				justify-content: space-between;
				padding: 10px;
				gap: 8px;
				z-index: 99;
				flex-wrap: nowrap;
			}

			.btn-group .mui-btn {
				flex-shrink: 1;
				flex-grow: 0;
				/* font-size: 0.75rem; */
			}

			.unsafe {
				color: #f0ad4e;
			}

			.safe {
				color: #4cd964;
			}
			:root {
				--bg-color: #f7f7f7;
			
				--statusbar-height: 24px;
			}
			.wrapper{
				position: fixed;
				top:calc(var(--statusbar-height) + 44px + 53px);
				left:10px;
				right: 10px;
				bottom:40px;
				background-color: antiquewhite;
				border-radius: 6px;
				bottom:35px;
			}
		</style>
	</head>
	<body>
		<div id="page">
			<header class="mui-bar mui-bar-nav">
				<h1 class="mui-title">服务器列表</h1>
				<a class="mui-icon mui-icon-gear-filled mui-pull-right" @click="openSetting()"></a>
			</header>

			<div class="mui-content">
				<div class="btn-group">
					<button type="button" class="mui-btn  mui-icon mui-icon-plus" @click="addServer()">添加服务器</button>

					<button type="button" class="mui-btn mui-btn-primary  mui-icon mui-icon-download" @click="downloadServerList()">下载列表</button>

					<button type="button" class="mui-btn  mui-btn-red  mui-icon mui-icon-upload" @click="uploadServerList()">同步到服务器</button>
				</div>
				
				<div class="wrapper">
					
				</div>

				<div class="mui-scroll-wrapper">
					<div class="mui-scroll" style="border-radius:10px ;">
						<div class="mui-card">
							<ul class="mui-table-view">
								<li class="mui-table-view-cell item" v-for="server in serverList" :key="server.id" @click.stop="openDetail(server, $event)">
									<div class="mui-slider-handle">
										<span class="mui-navigate-right">
											{{server.server_name}}
											<span v-if="server.username">- </span>
											<span v-if="server.username" :class="server.password?'unsafe':''">{{server.username}}</span>
											<p>
												<span v-if="isHttps(server.server_addr)" class="safe">https</span>{{formatServerAddr(server.server_addr)}}
											</p>
										</span>
									</div>

									<div class="mui-slider-right mui-disabled">
										<a class="mui-btn mui-btn-red delete" @click.stop="deleteServer(server.id, $event)">删除</a>
										<a class="mui-btn mui-btn-warning edit" @click.stop="editServer(server, $event)">修改</a>
										<a class="mui-btn mui-btn-primary website" @click.stop="viewWebsite(server, $event)">网站</a>
									</div>
								</li>

							</ul>
							<div class="mui-card-content-inner" v-if="serverList.length===0">暂无服务器列表</div>
						</div>
					</div>
				</div><!--end .mui-scroll-wrapper-->
			</div><!--.mui-content-->
		</div><!--end #page-->

		<div class="safe-area"></div>

		<script src="js/init.js"></script>
		<script src="js/util.js"></script>
		<script src="js/immersed2.js"></script>
		<script src="js/vue.global.prod.min.js"></script>
		<script>
			mui.init({
				statusBarBackground: '#f7f7f7',
				beforeback: function() {
					//首页返回切换到后台
					let main = plus.android.runtimeMainActivity()
					main.moveTaskToBack(false)

					return false
				},
				/* keyEventBind: {
					backbutton: true, //false：关闭back按键监听
					menubutton: false //false：关闭menu按键监听
				}, */
			})

			let uuid = ''
			let userToken = ''

			mui.plusReady(function() {
				uuid = plus.device.uuid

				//plus.navigator.setStatusBarStyle("dark")
				//plus.navigator.setStatusBarBackground('#f7f7f7')

				if (mui.os.ios) {
					//injectComponentStyle()
				}
				injectSafeareaStyle()

				app.mount('#page')
				
				const statusbarheight = plus.navigator.getStatusbarHeight()
				document.documentElement.style.setProperty('--statusbar-height', statusbarHeight + 'px')
			})

			const {
				createApp,
				ref,
				onMounted,
			} = Vue

			const app = createApp({
				setup() {
					const serverList = ref([])

					const saveServerList = () => {
						localStorage.setItem('serverList', JSON.stringify(serverList.value))
					}

					const sortServerList = () => {
						serverList.value.sort((a, b) => Number(b.sort || 0) - Number(a.sort || 0))
					}

					const closeSwipeout = (event) => {
						const li = event?.target?.closest?.('li')
						if (li) {
							mui.swipeoutClose(li)
						}
					}

					const getUserToken = () => localStorage.getItem('userToken') ?? ''

					const showRequestError = (errorThrown = '') => {
						mui.alert(`服务器繁忙：${errorThrown || '请稍后再试'}`, '系统提示', () => {}, 'div')
					}

					const isHttps = (addr = '') => String(addr).startsWith('https')

					const formatServerAddr = (addr = '') => String(addr).replace(/^https/, '')

					const addServer = () => {
						mui.openWindow({
							url: 'add.html',
							id: 'add.html',
							createNew: false,
							styles: {
								render: "always"
							}
						})
					}

					const openDetail = (server, event) => {
						closeSwipeout(event)

						/* const titleNView = {
						    backgroundColor: '#f7f7f7',//导航栏背景色
						    titleText: '透明渐变',//导航栏标题
						    titleColor: '#ff0000',//文字颜色
						    type:'transparent',//透明渐变样式
						    autoBackButton: true,//自动绘制返回箭头
						    splitLine:{//底部分割线
						        color:'#cccccc'
						    }
						} */

						mui.openWindow({
							url: 'detail.html',
							id: 'detail.html',
							extras: {
								server: server
							},
							styles: {
								bottom: '0px'
								/* titleNView:titleNView  */
							}
						})
					}

					const deleteServer = (id = '', event) => {
						mui.confirm('确定要删除该服务器信息吗？', '系统提示', ['取消', '删除'], (e) => {
							if (e.index === 1) {
								const index = serverList.value.findIndex(item => item.id === id)

								if (index !== -1) {
									serverList.value.splice(index, 1)
									saveServerList()
								}
							}
							closeSwipeout(event)
						}, 'div')
					}

					const editServer = (server, event) => {
						closeSwipeout(event)
						mui.openWindow({
							url: 'edit.html',
							id: 'edit.html',
							createNew: false,
							extras: {
								server: server
							},
						})
					}

					const viewWebsite = (server, event) => {
						closeSwipeout(event)
						mui.openWindow({
							url: 'detail.html',
							id: 'detail.html',
							createNew: false,
							extras: {
								server: server,
								showSystemInfo: false
							},
						})
					}

					const showServerList = () => {
						let savedServerList = []

						try {
							savedServerList = JSON.parse(localStorage.getItem('serverList') || '[]')
						} catch (error) {
							localStorage.removeItem('serverList')
						}

						if (savedServerList.length) {
							serverList.value = savedServerList
							sortServerList()
						} else {
							mui.confirm('服务器列表为空\n请先下载列表', '系统提示', ['取消', '下载'], (e) => {
								if (e.index === 1) {
									getServerList()
								}
							}, 'div')
						}
					}

					const downloadServerList = () => {
						mui.confirm(
							'确定要下载服务器列表吗?\n此操作会覆盖本地服务器列表',
							'系统提示',
							['取消', '下载'],
							(e) => {
								if (e.index === 0) {
									return true
								}
								getServerList()
							}, 'div')
					}

					const getServerList = () => {
						userToken = getUserToken()
						mui.ajax(BASEURL + '/baota.php?action=downloadServerList', {
							data: {
								userToken: userToken
							},
							dataType: 'json',
							type: 'get',
							timeout: 10000,
							success: (res) => {
								if (res.code === 0) {
									serverList.value = Array.isArray(res.data) ? res.data : []
									sortServerList()
									saveServerList()

									mui.toast('服务器列表下载完成', {
										type: 'div'
									})
								} else {
									mui.alert(res.msg, '系统提示', () => {}, 'div')
								}
							},
							error: (xhr, type, errorThrown) => {
								showRequestError(errorThrown)
							}
						})
					}

					const uploadServerList = () => {
						userToken = getUserToken()
						mui.confirm(
							'确定要将当前列表同步到服务器吗?\n此操作会覆盖服务器上保存的列表',
							'系统提示',
							['取消', '同步'], (e) => {
								if (e.index === 0) {
									return true
								}
								mui.ajax(BASEURL + '/baota.php?action=uploadServerList', {
									data: {
										uuid: uuid,
										userToken: userToken,
										serverList: JSON.stringify(serverList.value)
									},
									dataType: 'json', //服务器返回json格式数据
									type: 'post', //HTTP请求类型
									timeout: 10000, //超时时间设置为10秒；
									success: (res) => {
										mui.alert(res.msg, '系统提示', '确定', () => {}, 'div')
									},
									error: (xhr, type, errorThrown) => {
										showRequestError(errorThrown)
									}
								});

							}, 'div')
					}

					const openSetting = () => {
						mui.openWindow({
							url: 'setting.html',
							id: 'setting.html',
							createNew: true,
						})
					}

					onMounted(() => {
						showServerList()

						mui('#page')[0].classList.add('vue-loaded')

						mui('.mui-scroll-wrapper').scroll({
							bounce: true
						})

						window.addEventListener('refreshList', (event) => {
							const newServerData = event.detail.server

							const index = serverList.value.findIndex(item => item.id === newServerData.id)
							if (index !== -1) {
								// 直接修改已有属性是响应式的
								serverList.value[index] = newServerData
							} else {
								//添加新的数据
								serverList.value.push(newServerData)
							}

							sortServerList()
							saveServerList()
						})

						window.addEventListener('clearList', (event) => {
							serverList.value.length = 0
							saveServerList()
						})
					})

					return {
						serverList,
						addServer,
						getServerList,
						openDetail,
						deleteServer,
						editServer,
						viewWebsite,
						showServerList,
						downloadServerList,
						uploadServerList,
						openSetting,
						isHttps,
						formatServerAddr,
					}
				}
			})
		</script>
	</body>
</html>
